
services:
  image-generator:
    build: .
    container_name: image-generator
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    gpus: all

    environment:
      HF_HOME: /models
      MODEL_ID: black-forest-labs/FLUX.1-schnell

    volumes:
      - ./models:/models

    shm_size: "2gb"
